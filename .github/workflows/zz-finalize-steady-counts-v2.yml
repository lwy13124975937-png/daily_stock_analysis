name: Finalize steady-income count semantics v2

on:
  push:
    branches: [system-audit-final]
    paths:
      - '.github/workflows/zz-finalize-steady-counts-v2.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout handoff branch
        uses: actions/checkout@v5
        with:
          ref: system-audit-final
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            .github/requirements-ci.lock

      - name: Install locked CI dependencies
        run: python -m pip install -r .github/requirements-ci.lock

      - name: Materialize and apply audited patch
        shell: bash
        run: |
          printf '%s' '' | base64 -d | gzip -d > scripts/_finalize_steady_counts.py
          python scripts/_finalize_steady_counts.py

      - name: Full offline regression and governance
        run: |
          python scripts/check_ai_assets.py
          python -m pytest -q -m 'not network'
          python -m compileall -q api scripts src tests
          python -m flake8 src/services/steady_income_contracts.py scripts/build_steady_income_report.py src/site/builder.py src/site/validator.py src/services/steady_income_service.py api/v1/schemas/steady_income.py tests/test_steady_income_pages.py tests/test_steady_income_service.py
          git diff --check

      - name: Commit verified production changes and self-clean
        shell: bash
        run: |
          rm -f scripts/_finalize_steady_counts.py
          rm -f .github/workflows/zz-finalize-steady-counts.yml
          rm -f .github/workflows/zz-finalize-steady-counts-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git status --short
          git commit -m 'Finalize steady-income evaluation count semantics'
          git push origin HEAD:system-audit-final
