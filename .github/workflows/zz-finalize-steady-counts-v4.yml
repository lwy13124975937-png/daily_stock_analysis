name: Finalize steady-income count semantics v4

on:
  push:
    branches: [system-audit-final]
    paths:
      - '.github/workflows/zz-finalize-steady-counts-v4.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout latest handoff branch
        uses: actions/checkout@v5
        with:
          ref: system-audit-final
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            .github/requirements-ci.lock

      - name: Install locked CI dependencies
        run: python -m pip install -r .github/requirements-ci.lock

      - name: Apply already full-suite-tested patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import re

          workflow = Path('.github/workflows/zz-finalize-steady-counts-v2.yml').read_text(encoding='utf-8')
          match = re.search(
              r"printf '%s' '([A-Za-z0-9+/=]+)' \| base64 -d \| gzip -d > scripts/_finalize_steady_counts\.py",
              workflow,
          )
          if not match:
              raise SystemExit('audited patch payload not found')
          Path('scripts/_finalize_steady_counts.py').write_bytes(
              gzip.decompress(base64.b64decode(match.group(1)))
          )
          PY
          python scripts/_finalize_steady_counts.py
          python - <<'PY'
          from pathlib import Path
          path = Path('src/site/builder.py')
          text = path.read_text(encoding='utf-8')
          for old, new in (
              ('\n\ndef _render_steady(', '\n\n\ndef _render_steady('),
              ('\n\ndef _render_market_page(', '\n\n\ndef _render_market_page('),
          ):
              if old not in text:
                  raise SystemExit(f'expected formatting boundary missing: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Focused regression after format-only delta
        shell: bash
        run: |
          python scripts/check_ai_assets.py
          python -m pytest -q tests/test_steady_income_pages.py tests/test_steady_income_service.py tests/test_public_site_contract.py tests/test_holding_report_workflow.py
          python -m compileall -q api scripts src tests
          python -m flake8 src/services/steady_income_contracts.py scripts/build_steady_income_report.py src/site/builder.py src/site/validator.py src/services/steady_income_service.py src/reports/public_holdings.py api/v1/schemas/steady_income.py tests/test_steady_income_pages.py tests/test_steady_income_service.py tests/test_holding_report_workflow.py
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import subprocess

          expected = {
              'api/v1/schemas/steady_income.py',
              'scripts/build_steady_income_report.py',
              'src/services/steady_income_contracts.py',
              'src/services/steady_income_service.py',
              'src/site/builder.py',
              'src/site/validator.py',
              'tests/test_steady_income_pages.py',
              'tests/test_steady_income_service.py',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          unexpected = changed - expected - {'scripts/_finalize_steady_counts.py'}
          missing = expected - changed
          if unexpected or missing:
              raise SystemExit(f'patch scope mismatch: unexpected={sorted(unexpected)} missing={sorted(missing)}')
          contracts = Path('src/services/steady_income_contracts.py').read_text(encoding='utf-8')
          if 'STEADY_INCOME_SCHEMA_VERSION = 6' not in contracts:
              raise SystemExit('schema v6 missing')
          page = Path('src/site/builder.py').read_text(encoding='utf-8')
          for token in ('deep_attempted_count', 'deep_completed_count', '尝试深度评估', '完整规则判断'):
              if token not in page:
                  raise SystemExit(f'count contract token missing: {token}')
          PY

      - name: Commit verified changes and remove temporary machinery
        shell: bash
        run: |
          rm -f scripts/_finalize_steady_counts.py
          rm -f .github/workflows/zz-finalize-steady-counts.yml
          rm -f .github/workflows/zz-finalize-steady-counts-v2.yml
          rm -f .github/workflows/zz-finalize-steady-counts-v3.yml
          rm -f .github/workflows/zz-finalize-steady-counts-v4.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: separate attempted and completed steady-income counts'
          git push origin HEAD:system-audit-final
